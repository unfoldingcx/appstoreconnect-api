<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- App Store Connect Icon -->
  <defs>
    <linearGradient id="appleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#555BFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0071E3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5F5F7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8E8ED;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bgGradient)"/>

  <!-- Apple symbol with App Store theme -->
  <g transform="translate(32, 32)">
    <!-- Apple leaf -->
    <path d="M -2 -12 Q -6 -10 -8 -6 Q -10 -2 -8 2" 
          fill="none" stroke="url(#appleGradient)" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Apple body -->
    <circle cx="0" cy="2" r="10" fill="url(#appleGradient)"/>
    
    <!-- Apple bite -->
    <circle cx="7" cy="-4" r="3" fill="#F5F5F7"/>

    <!-- Checkmark (submission check) -->
    <g transform="translate(3, 3)">
      <path d="M -3 0 L -1 2 L 3 -2" 
            fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Border for definition -->
  <rect width="64" height="64" rx="14" fill="none" stroke="#D8D8D8" stroke-width="1" opacity="0.5"/>
</svg>

